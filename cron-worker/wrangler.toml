name = "lotomais-cron"
main = "worker.js"
compatibility_date = "2024-11-01"

# Horários (UTC). Sorteios saem ~20-21h BRT (23-00 UTC), então checamos várias vezes
# na janela pós-sorteio + um reforço de manhã. BRT = UTC-3.
[triggers]
crons = [
  "15 23 * * *",  # ~20h15 BRT — logo após o sorteio
  "45 23 * * *",  # ~20h45 BRT
  "30 0 * * *",   # ~21h30 BRT
  "30 1 * * *",   # ~22h30 BRT
  "0 3 * * *",    # ~00h BRT — pega quem saiu mais tarde
  "0 12 * * *"    # ~09h BRT — reforço na manhã seguinte
]

# Atualiza a base de concursos de TODAS as loterias automaticamente.
# Pressupõe que a pasta "lotofacil" é a RAIZ do repositório publicado.
# (Se o app estiver numa subpasta, ajuste os caminhos abaixo.)
name: Atualizar loterias

on:
  schedule:
    # GitHub atrasa/agrupa crons (best-effort), então usamos VÁRIOS horários na
    # janela pós-sorteio para não depender de um único disparo pontual.
    - cron: '30 23 * * *'  # ~20h30 BRT — logo após o sorteio
    - cron: '30 0 * * *'   # ~21h30 BRT
    - cron: '0 2 * * *'    # ~23h BRT
    - cron: '0 4 * * *'    # ~01h BRT
    - cron: '0 11 * * *'   # ~08h BRT — reforço na manhã seguinte
    - cron: '0 15 * * 0'   # Domingo ~12h BRT — sorteios que passaram de sábado p/ domingo 11h
  workflow_dispatch: {}    # permite rodar manualmente pelo botão do GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar concursos novos
        run: node scripts/atualizar.js

      - name: Salvar alterações (se houver)
        if: always()   # commita o que conseguiu mesmo se alguma fonte falhou (o job ainda fica vermelho)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --staged --quiet; then
            echo "Sem concursos novos."
          else
            git commit -m "Atualiza concursos das loterias"
            git push
          fi
